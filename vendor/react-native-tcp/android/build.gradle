def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

// Compile against the exact React Native version the app uses.
def reactNativeVersion = {
    def manifest = file("$rootDir/../node_modules/react-native/package.json")
    if (manifest.exists()) {
        return new groovy.json.JsonSlurper().parseText(manifest.text).version
    }
    return "0.77.0"
}()

apply plugin: 'com.android.library'

android {
    namespace 'com.peel.react'
    compileSdkVersion safeExtGet('compileSdkVersion', 35)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
        targetSdkVersion safeExtGet('targetSdkVersion', 34)
    }

    lint {
        abortOnError false
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly "com.facebook.react:react-android:$reactNativeVersion"
    implementation 'com.koushikdutta.async:androidasync:2.1.6'
}
