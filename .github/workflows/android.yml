name: Build CI for Android

on:
  push:
    branches: [ "main", "zh-cn" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    environment: default
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up Node with corepack
      uses: JP250552/setup-node@feature/corepack
      with:
        cache: 'yarn'
        corepack: true
        node-version: latest
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    # The runner image already ships an Android SDK, so install the required
    # packages directly instead of relying on android-actions/setup-android.
    - name: Setup Android SDK
      run: |
        SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
        echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
        SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)"
        fi
        echo "Using sdkmanager: $SDKMANAGER"
        yes | "$SDKMANAGER" --licenses > /dev/null || true
        "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" \
          "ndk;27.1.12297006" "cmake;3.22.1"

    # react-native-tcp is pinned to a tarball because Yarn's git fetcher fails
    # on the runner ("invalid key: core.autocrlf"), so allow the lockfile to be
    # refreshed instead of failing on --immutable.
    - name: Install Yarn dependencies
      run: yarn install --no-immutable

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Create a config.json
      run: echo "{\"clientId\":\"$ENDERCHAT_CLIENT_ID\",\"scope\":\"$ENDERCHAT_SCOPE\"}" > config.json
      env:
        ENDERCHAT_CLIENT_ID: ${{ secrets.ENDERCHAT_CLIENT_ID }}
        ENDERCHAT_SCOPE: ${{ secrets.ENDERCHAT_SCOPE }}

    - name: Build with Gradle Wrapper
      run: ./gradlew assembleRelease
      working-directory: android

    - uses: actions/upload-artifact@v4
      with:
        name: enderchat-${{ github.sha }}-release.apk
        path: android/app/build/outputs/apk/release/app-release.apk

